{% extends "base.html" %}

{% block page_title %}Register User{% endblock %}

{% block content %}
<div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-person-plus"></i> Register New User</h2>
            <p class="text-muted">Create a new user account. New accounts require administrator activation.</p>
        </div>
        <a href="{{ url_for('auth.users') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Users
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="name@hist.edu.ly" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="">Select a role</option>
                            <option value="Administrator">Administrator</option>
                            <option value="Extension Officer">Extension Officer</option>
                            <option value="Faculty Lead">Faculty Lead</option>
                            <option value="Institute Director">Institute Director</option>
                            <option value="IT Infrastructure Lead">IT Infrastructure Lead</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required minlength="6">
                    </div>
                </div>

                <hr class="my-4">
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('auth.users') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-save"></i> Create User
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
