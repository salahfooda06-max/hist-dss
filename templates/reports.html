{% extends "base.html" %}

{% block content %}
<div class="page-header animate-fade-in">
    <h1 class="page-title"><i class="bi bi-file-earmark-pdf"></i> Reports</h1>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card-custom h-100 animate-fade-in" style="cursor: pointer;">
            <div class="card-body-custom text-center py-5">
                <div class="mb-3">
                    <div class="stat-icon success mx-auto" style="width: 64px; height: 64px; font-size: 2rem;"><i class="bi bi-people"></i></div>
                </div>
                <h4 class="fw-bold mb-2">Students Report</h4>
                <p class="text-muted mb-4">Contains a list of all registered students with academic and service data</p>
                <form method="POST" action="{{ url_for('main.generate_report') }}">
                    <input type="hidden" name="report_type" value="students">
                    <button type="submit" class="btn btn-success-custom btn-custom">
                        <i class="bi bi-download"></i> Download Report
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card-custom h-100 animate-fade-in" style="cursor: pointer;">
            <div class="card-body-custom text-center py-5">
                <div class="mb-3">
                    <div class="stat-icon info mx-auto" style="width: 64px; height: 64px; font-size: 2rem;"><i class="bi bi-lightbulb"></i></div>
                </div>
                <h4 class="fw-bold mb-2">Recommendations Report</h4>
                <p class="text-muted mb-4">Contains all recommendations provided to students with their status and ratings</p>
                <form method="POST" action="{{ url_for('main.generate_report') }}">
                    <input type="hidden" name="report_type" value="recommendations">
                    <button type="submit" class="btn btn-primary-custom btn-custom">
                        <i class="bi bi-download"></i> Download Report
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
