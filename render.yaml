apiVersion: "1.0"
services:
  - type: web
    name: hist-dss
    region: omaha
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hist-dss-db
          property: connectionString
      - key: AES_KEY
        value: "32-bytes-encryption-key-for-aes-256!!"
      - key: CLOUD_API_URL
        value: "https://hist-dss.onrender.com/api/sync"
      - key: FLASK_DEBUG
        value: "0"
    healthCheckPath: /health

databases:
  - name: hist-dss-db
    region: omaha
    plan: free
